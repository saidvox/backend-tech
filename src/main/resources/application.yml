spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: techstore-pro-backend
  profiles:
    active: postgres
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-disabled}
            scope:
              - openid
              - profile
              - email
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
  datasource:
    url: jdbc:h2:mem:techstore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

app:
  datasource:
    auto-detect: ${APP_DATASOURCE_AUTO_DETECT:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  jwt:
    secret: ${JWT_SECRET:techstore-pro-dev-secret-key-change-in-production-123456}
    issuer: ${JWT_ISSUER:techstore-pro}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:4200/auth/oauth2/success}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:4200/login}
  mail:
    verification:
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:TechStore Pro <no-reply@techstore.local>}
      code-ttl: ${MAIL_VERIFICATION_CODE_TTL:15m}
      subject: ${MAIL_VERIFICATION_SUBJECT:Codigo de verificacion - TechStore Pro}
    purchase:
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:TechStore Pro <no-reply@techstore.local>}
      subject: ${MAIL_PURCHASE_SUBJECT:Confirmacion de compra - TechStore Pro}
      store-recipient: ${MAIL_PURCHASE_STORE_RECIPIENT:${MAIL_USERNAME:}}
  payments:
    mercado-pago:
      mode: ${MERCADO_PAGO_MODE:simulation}
      access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
      api-base-url: ${MERCADO_PAGO_API_BASE_URL:https://api.mercadopago.com}
      simulated-checkout-url: ${MERCADO_PAGO_SIMULATED_CHECKOUT_URL:http://localhost:4200/checkout/mercado-pago/simulacion}
      notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8080/pagos/webhooks/mercado-pago}
      success-url: ${MERCADO_PAGO_SUCCESS_URL:http://localhost:4200/checkout/mercado-pago/retorno}
      failure-url: ${MERCADO_PAGO_FAILURE_URL:http://localhost:4200/checkout/mercado-pago/retorno}
      pending-url: ${MERCADO_PAGO_PENDING_URL:http://localhost:4200/checkout/mercado-pago/retorno}
      test-payer-email: ${MERCADO_PAGO_TEST_PAYER_EMAIL:}
      wallet-purchase-only: ${MERCADO_PAGO_WALLET_PURCHASE_ONLY:false}
  storage:
    google-drive:
      enabled: ${GOOGLE_DRIVE_ENABLED:false}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
      credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
      credentials-base64: ${GOOGLE_DRIVE_CREDENTIALS_BASE64:}
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
      refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
      max-image-size-bytes: ${GOOGLE_DRIVE_MAX_IMAGE_SIZE_BYTES:5242880}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techstore}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:techstore}
    password: ${DB_PASSWORD:techstore123}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        "[format_sql]": false
  h2:
    console:
      enabled: false

app:
  datasource:
    auto-detect: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
